<html lang="fr">
<head>

<title>CN Bourg-en-Bresse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }

body {
  font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  background: linear-gradient(180deg, #1a4a7a 0%, #1e6399 30%, #2980b9 65%, #5dade2 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  position: relative;
  overflow-x: hidden;
}

/* Lignes de couloir */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(90deg,
    transparent 0px, transparent 78px,
    rgba(255,255,255,0.07) 78px, rgba(255,255,255,0.07) 80px
  );
  pointer-events: none;
  z-index: 0;
}

/* Bulles */
.bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bubble {
  position: absolute; bottom: -20px; border-radius: 50%;
  background: rgba(255,255,255,0.15);
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) scale(1); opacity: 0.6; }
  100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

/* Vagues */
.waves { position: fixed; bottom: 0; left: 0; width: 100%; pointer-events: none; z-index: 0; }
.wave { animation: wave linear infinite; transform-origin: center bottom; }
.wave1 { animation-duration: 8s; }
.wave2 { animation-duration: 11s; animation-delay: -3s; }
@keyframes wave {
  0%   { transform: translateX(0); }
  50%  { transform: translateX(-3%); }
  100% { transform: translateX(0); }
}

.container {
  position: relative; z-index: 1;
  max-width: 600px; width: 100%;
  text-align: center;
}

/* Logo */
.logo-wrap {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  margin-bottom: 28px;
  overflow: hidden;
}
.logo-wrap img {
  height: 160px; width: auto; object-fit: contain; display: block;
}

/* Titre */
.club-name {
  font-size: 26px; font-weight: 800;
  color: #ffffff; letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.club-sub {
  font-size: 18px; color: rgba(255,255,255,0.85);
  margin-bottom: 44px; font-weight: 600;
}

/* Groupes */
.groups {
  display: flex; flex-direction: column; gap: 20px;
  width: 100%;
}

/* Carte groupe */
.group-card {
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 14px 44px rgba(0,0,0,0.42);
  border: 1px solid rgba(255,255,255,0.18);
  transition: transform 0.22s cubic-bezier(.2,.8,.4,1), box-shadow 0.22s;
}
.group-card:hover {
  transform: translateY(-5px) scale(1.01);
  box-shadow: 0 24px 64px rgba(0,0,0,0.55);
}

.avenirs-card {
  background: linear-gradient(135deg, #15803d 0%, #16a34a 45%, #4ade80 100%);
}
.benjamins-card {
  background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 48%, #a78bfa 100%);
}

/* Bouton titre du groupe */
.group-btn {
  width: 100%; padding: 0;
  background: none; border: none;
  cursor: pointer; text-decoration: none;
  display: block;
}
.group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 28px 22px 28px;
  position: relative; overflow: hidden;
}
.group-header::after {
  content: '';
  position: absolute; inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.2s;
  pointer-events: none;
}
.group-card:hover .group-header::after { background: rgba(255,255,255,0.07); }

.group-text { text-align: left; position: relative; z-index: 1; }
.group-badge {
  font-size: 15px; font-weight: 800;
  color: rgba(255,255,255,0.70);
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 6px;
}
.group-title {
  font-size: 36px; font-weight: 900;
  color: #fff; letter-spacing: 1px;
  line-height: 1;
  text-shadow: 0 2px 16px rgba(0,0,0,0.22);
}
.group-cta {
  font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.78);
  margin-top: 12px;
  display: flex; align-items: center; gap: 6px;
}
.group-cta-arrow {
  display: inline-block;
  transition: transform 0.2s;
}
.group-card:hover .group-cta-arrow { transform: translateX(6px); }

.group-artwork {
  flex-shrink: 0;
  position: relative; z-index: 1;
  filter: drop-shadow(0 6px 20px rgba(0,0,0,0.28));
  opacity: 0.95;
}

/* Sous-onglets Benjamins */
.sub-tabs {
  display: none;
  border-top: 1px solid rgba(255,255,255,0.18);
  padding: 18px 20px 22px;
  background: rgba(0,0,0,0.18);
  gap: 12px;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
}
.sub-tabs.open { display: flex; }

.sub-tab {
  flex: 1; min-width: 130px;
  background: rgba(255,255,255,0.12);
  border-radius: 14px;
  border: 1.5px solid rgba(255,255,255,0.22);
  padding: 18px 12px;
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  cursor: default;
  backdrop-filter: blur(4px);
}
.sub-tab-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.icon-perf { background: linear-gradient(135deg,#0284c7,#38bdf8); box-shadow:0 3px 10px rgba(2,132,199,0.4); }
.icon-pres { background: linear-gradient(135deg,#16a34a,#4ade80); box-shadow:0 3px 10px rgba(22,163,74,0.4); }
.icon-comp { background: linear-gradient(135deg,#f59e0b,#fcd34d); box-shadow:0 3px 10px rgba(245,158,11,0.4); }
.sub-tab-name {
  font-size: 12px; font-weight: 800; color: rgba(255,255,255,0.90);
  letter-spacing: 0.5px; text-align: center;
}
.sub-tab-badge {
  font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.80);
  border-radius: 8px; padding: 2px 10px;
  border: 1px solid rgba(255,255,255,0.2);
}

/* Footer */
.footer {
  margin-top: 44px;
  font-size: 12px; color: rgba(255,255,255,0.4);
  position: relative; z-index: 1;
}
</style>
