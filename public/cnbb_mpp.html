// Build legend
const leg=document.getElementById('legend');
PERF_C.forEach(c=>{
  const d=document.createElement('div');
  d.innerHTML=`<span style="background:${c.bg};border-color:rgba(0,0,0,.15);"></span>${c.label} pts`;
  leg.appendChild(d);
});

// Build table
const tbl=document.getElementById('main');
const thead=tbl.createTHead();
const hr=thead.insertRow();
const thName=document.createElement('th');
thName.textContent='Nageur·euse';
hr.appendChild(thName);
E.forEach(e=>{
  const th=document.createElement('th');
  th.textContent=e;
  hr.appendChild(th);
});

const tbody=tbl.createTBody();
swimmers.forEach((sw,si)=>{
  const color=NAME_C[sw.g+sw.y];
  const tr=tbody.insertRow();
  const tdName=tr.insertCell();
  tdName.textContent=sw.n;
  tdName.style.color=color;
  sw.p.forEach((perf,ei)=>{
    const td=tr.insertCell();
    if(perf===null){
      td.innerHTML='<span class="empty">—</span>';
    } else {
      const c=pc(perf.p);
      td.style.background='transparent';
      const hist=history[si]&&history[si][ei];
      const hasHist=hist&&hist.length>0;
      if(hasHist) td.classList.add('clickable');
      const badge=document.createElement('div');
      badge.className='perf-badge';
      badge.style.background=c.bg;
      badge.style.color=c.tx;
      badge.innerHTML=`<span class="perf-time">${perf.t}</span><span class="perf-pts">${perf.p} pts</span>`;
      td.appendChild(badge);
      if(hasHist){
        td.title=`${hist.length} performance${hist.length>1?'s':''} – cliquer pour voir`;
        td.addEventListener('click',()=>openModal(sw,ei,hist,c));
      }
    }
  });
});

// Modal logic
const modalBg=document.getElementById('modalBg');
const modalTitle=document.getElementById('modalTitle');
const modalEvent=document.getElementById('modalEvent');
const modalBody=document.getElementById('modalBody');
const modalClose=document.getElementById('modalClose');
const modalHint=document.getElementById('modalHint');

function openModal(sw,ei,perfs,bestColor){
  const sw_name=sw.n, grp=sw.g+sw.y, color=GROUP_COLORS?GROUP_COLORS[grp]:(sw.g==='F'?(sw.y==='2016'?'#9d174d':'#ec4899'):(sw.y==='2016'?'#1e3a8a':'#3b82f6'));
  modalTitle.textContent=sw_name;
  modalTitle.style.borderLeft='4px solid '+(bestColor||'#3b82f6');
  modalEvent.textContent=E[ei];
  let html='';
  if(!perfs||perfs.length===0){
    html='<p style="color:#9ca3af;padding:12px 0">Aucune performance enregistrée</p>';
  } else {
    html='<table style="width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed"><colgroup><col class="col-num"><col><col><col><col></colgroup><thead><tr>'
      +'<th style="color:#9ca3af;font-size:10px;width:24px;padding:6px 4px;text-align:center;">#</th>'
      +'<th style="color:#9ca3af;font-size:10px;padding:6px 8px;text-align:left;">Temps</th>'
      +'<th style="color:#9ca3af;font-size:10px;padding:6px 8px;text-align:center;">Pts</th>'
      +'<th style="color:#9ca3af;font-size:10px;padding:6px 8px;text-align:left;">Date</th>'
      +'<th style="color:#9ca3af;font-size:10px;padding:6px 8px;text-align:left;">Lieu</th>'
      +'</tr></thead><tbody>';
    perfs.forEach((p,i)=>{
      const pc_=pc(p.p);
      const bg=pc_?pc_.bg:'#f3f4f6', tx=pc_?pc_.tx:'#374151';
      html+=`<tr>
        <td style="color:#9ca3af;font-size:10px;width:24px;max-width:24px;padding:7px 2px;text-align:center;">${i+1}</td>
        <td style="padding:7px 8px;font-size:13px;font-weight:700;color:#1e293b;">${p.t}</td>
        <td style="padding:7px 8px;text-align:center;"><span style="background:${bg};color:${tx};padding:2px 7px;border-radius:12px;font-size:11px;font-weight:700">${p.p}</span></td>
        <td style="padding:7px 8px;font-size:12px;color:#6b7280;">${p.d||''}</td>
        <td style="padding:7px 8px;font-size:12px;color:#6b7280;">${p.l||''}</td>
      </tr>`;
    });
    html+='</tbody></table>';
  }
  modalBody.innerHTML=html;
  document.getElementById('perf-modal').style.display='flex';
}

modalClose.addEventListener('click',()=>{
  document.getElementById('perf-modal').style.display='none';
});
document.getElementById('perf-modal').addEventListener('click',function(e){
  if(e.target===this) this.style.display='none';
});

// Build table
const NAME_C_MAP = NAME_C;
function buildTable(){
  const tbody=document.getElementById('perf-tbody');
  let html='';
  swimmers.forEach((sw,si)=>{
    const grp=sw.g+sw.y;
    const col=NAME_C[grp]||'#6b7280';
    html+=`<tr class="swimmer-row">`;
    html+=`<td class="swimmer-name"><span class="group-badge" style="background:${col}">${sw.g}${sw.y.slice(2)}</span>${sw.n}</td>`;
    sw.p.forEach((perf,ei)=>{
      if(perf===null){
        html+=`<td class="perf-cell empty">–</td>`;
      } else {
        const pc_=pc(perf.p);
        const bg=pc_?pc_.bg:'#f3f4f6', tx=pc_?pc_.tx:'#374151';
        const hist=history[si][ei];
        html+=`<td class="perf-cell" style="background:${bg};color:${tx}" onclick="openModal(swimmers[${si}],${ei},${JSON.stringify(hist)},${JSON.stringify(bg)})" title="${sw.n} – ${E[ei]}">
          <span class="perf-time">${perf.t}</span>
          <span class="perf-pts">${perf.p} pts</span>
        </td>`;
      }
    });
    html+='</tr>';
  });
  tbody.innerHTML=html;
}

document.addEventListener('DOMContentLoaded', buildTable);
